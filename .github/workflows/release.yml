name: Publish client release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out client files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify client scope, publish and download-check assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          if git ls-tree -r --name-only HEAD | grep -Eq '^(web/|loadtest/|cmd/agentsshd/|internal/(server|store|ui)/|deploy/)'; then
            echo 'Console files are forbidden in this repository.' >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
          mkdir -p "$RUNNER_TEMP/client-assets"
          cp agentssh "$RUNNER_TEMP/client-assets/agentssh-linux-amd64"
          cp bin/agentssh-linux-arm64 "$RUNNER_TEMP/client-assets/agentssh-linux-arm64"
          cp third_party/*.LICENSE "$RUNNER_TEMP/client-assets/"
          (cd "$RUNNER_TEMP/client-assets" && sha256sum agentssh-linux-amd64 agentssh-linux-arm64 > SHA256SUMS)
          cat > "$RUNNER_TEMP/client-notes.md" <<'NOTES'
          AgentSSH Linux client source and static executables. The console is maintained separately.

          Download the matching architecture, rename it to `agentssh`, run `chmod +x agentssh`, then `./agentssh --server https://console.example/agentssh/`, replacing the example with your console. The generic client obtains authorization over HTTPS and registers after startup.

          v0.2.0 requires the runtime `--server` option and embeds no deployment configuration. Different consoles use independent state directories. Heartbeats, bidirectional WebSocket keepalives and bounded reconnect delays are retained.

          Linux amd64 was actually tested; arm64 is cross-compiled and has not been run on arm64 hardware.

          See README.md for startup, persistent state, diagnostics, explicit service installation and source builds. No administrator password or device/SSH private keys are included.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published enrollment artifacts.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/client-assets/"* --verify-tag --draft --title "$GITHUB_REF_NAME — AgentSSH Linux client" --notes-file "$RUNNER_TEMP/client-notes.md"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/download-check"
          (cd "$RUNNER_TEMP/download-check" && sha256sum -c SHA256SUMS)
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --json url,isDraft,tagName,assets
